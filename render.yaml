services:
  - type: web
    name: guibao-api
    runtime: python
    region: china
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MEMORY_DATABASE_URL
        fromDatabase:
          name: guibao-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: guibao-redis
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          name: guibao-web
          type: web
          property: host
      - key: AGENT_FUNCTION_CALLING_ENABLED
        value: "0"
      - key: STABLE_ANSWER_MODE
        value: "1"
      - key: WEB_SEARCH_ENABLED
        value: "0"
      - key: AGENT_MAX_TOOL_TURNS
        value: "2"
      - key: AGENT_TOOL_RESULT_CHARS
        value: "8000"
      - key: AGENT_LLM_MAX_TOKENS
        value: "1200"
      - key: QUERY_EXPANSION_ENABLED
        value: "1"
      - key: QUERY_EXPANSION_MAX_TOKENS
        value: "180"
      - key: QUERY_EXPANSION_CACHE_DAYS
        value: "30"
      - key: MEMORY_LLM_ENABLED
        value: "0"
      - key: MEMORY_IMPORT_JSON
        value: "0"
      - key: LLM_API_BASE
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini

  - type: web
    name: guibao-web
    runtime: static
    region: china
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: guibao-api
          type: web
          property: host
    buildFilter:
      paths:
        - frontend/**

  - type: worker
    name: guibao-memory-worker
    runtime: python
    region: china
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python scripts/memory_worker.py --loop 30
    envVars:
      - key: MEMORY_DATABASE_URL
        fromDatabase:
          name: guibao-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: guibao-redis
          property: connectionString
      - key: AGENT_FUNCTION_CALLING_ENABLED
        value: "0"
      - key: MEMORY_LLM_ENABLED
        value: "0"
      - key: LLM_API_BASE
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini

databases:
  - name: guibao-postgres
    databaseName: guibao
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

  - name: guibao-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
